name: Windows distributables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm dist:win
      - name: Test the packaged Windows application
        shell: pwsh
        run: |
          $env:FOLIO_E2E_EXECUTABLE = (Resolve-Path 'release/win-unpacked/Folio.exe').Path
          pnpm exec playwright test --output test-results/windows-packaged
      - name: Upload Windows distributables
        uses: actions/upload-artifact@v4
        with:
          name: Folio-windows-x64
          if-no-files-found: error
          path: |
            release/*-windows-x64-setup.exe
            release/*-windows-x64.zip
      - name: Upload E2E failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Folio-windows-e2e-failure
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

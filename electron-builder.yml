appId: es.folio.desktop
productName: Folio
directories:
  output: release
files:
  - dist/desktop/**
  - apps/web/dist/**
  - package.json
asar: true
asarUnpack:
  - node_modules/pdfjs-dist/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
linux:
  target: AppImage
  icon: dist/desktop/icon.png
  category: Office
  desktop:
    entry:
      Name: Folio
      Comment: Tu taller de libros digitales
mac:
  target: dmg
  category: public.app-category.books
  icon: dist/desktop/icon.png
win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: dist/desktop/icon.png
  artifactName: Folio-${version}-windows-${arch}.${ext}
nsis:
  artifactName: Folio-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

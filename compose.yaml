name: folio
services:
  folio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      FOLIO_DATA_DIR: /data
    volumes:
      - folio_data:/data
    restart: unless-stopped
volumes:
  folio_data:
